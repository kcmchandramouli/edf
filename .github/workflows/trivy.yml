name: Trivy

on:
  workflow_call:
    inputs:
      images:
        description: Extra image names to scan, separated by commas.
        required: false
        type: string
        default: ""
      severity:
        description: Severities that fail the check.
        required: false
        type: string
        default: "HIGH,CRITICAL"
      trivy_version:
        description: Trivy release version.
        required: false
        type: string
        default: "0.75.0"
      config_path:
        description: Optional Trivy config in the application repository.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v6

      - name: Install Trivy
        env:
          TRIVY_VERSION: ${{ inputs.trivy_version }}
        run: |
          version="$TRIVY_VERSION"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid trivy version: $version"
            exit 1
          fi
          asset="trivy_${version}_Linux-64bit.tar.gz"
          curl -sSfL -o "/tmp/${asset}" "https://github.com/aquasecurity/trivy/releases/download/v${version}/${asset}"
          curl -sSfL -o /tmp/trivy_checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_checksums.txt"
          line=$(grep " ${asset}$" /tmp/trivy_checksums.txt)
          if [ -z "$line" ]; then
            echo "Checksum entry not found for ${asset}"
            exit 1
          fi
          printf '%s\n' "$line" | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${asset}" -C /usr/local/bin trivy
          trivy version

      - name: Scan files
        if: ${{ !cancelled() }}
        env:
          TRIVY_SEVERITY: ${{ inputs.severity }}
          TRIVY_CONFIG: ${{ inputs.config_path }}
        run: |
          mkdir -p trivy-reports
          args=()
          if [ -n "$TRIVY_CONFIG" ]; then
            args+=(--config "$TRIVY_CONFIG")
          fi
          set +e
          trivy "${args[@]}" fs \
            --scanners vuln \
            --offline-scan \
            --severity "$TRIVY_SEVERITY" \
            --exit-code 1 \
            --skip-dirs .git,node_modules,vendor,target,dist,.terraform \
            . > trivy-reports/files.txt 2>&1
          rc=$?
          set -e
          cat trivy-reports/files.txt
          if grep -Eiq 'language-specific files: 0|no supported files' trivy-reports/files.txt; then
            echo "Nothing to scan: no dependency files found." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then
            echo "No ${TRIVY_SEVERITY} findings in dependency files." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$rc" -eq 1 ]; then
            echo "Findings in dependency files." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Dependency file scan failed." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Scan images
        if: ${{ !cancelled() }}
        env:
          TRIVY_IMAGES: ${{ inputs.images }}
          TRIVY_SEVERITY: ${{ inputs.severity }}
          TRIVY_CONFIG: ${{ inputs.config_path }}
        run: |
          mkdir -p trivy-reports
          : > trivy-reports/images.txt
          args=()
          if [ -n "$TRIVY_CONFIG" ]; then
            args+=(--config "$TRIVY_CONFIG")
          fi
          mapfile -t image_refs < <(
            {
              printf '%s\n' "$TRIVY_IMAGES" | tr ',' '\n'
              find . \
                \( -path './.git' -o -name node_modules -o -name vendor -o -name target -o -name dist \) -prune \
                -o -type f \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \) -print |
                while IFS= read -r file; do
                  grep -E '^[[:space:]]*FROM[[:space:]]+' "$file" || true
                done
              find . \
                \( -path './.git' -o -path './.github' -o -name node_modules -o -name vendor -o -name target -o -name dist \) -prune \
                -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print |
                while IFS= read -r file; do
                  grep -E '^[[:space:]]*-?[[:space:]]*image:[[:space:]]+' "$file" || true
                done
            } | while IFS= read -r line; do
              line="${line%%#*}"
              line="$(printf '%s' "$line" | sed -E 's/^[[:space:]]*-?[[:space:]]*image:[[:space:]]+//; s/^[[:space:]]*FROM[[:space:]]+(--platform=[^[:space:]]+[[:space:]]+)?//; s/[[:space:]]+[Aa][Ss][[:space:]].*$//; s/[[:space:]]+$//; s/^["'\'']//; s/["'\'']$//')"
              [ -n "$line" ] || continue
              case "$line" in
                scratch|*[\$\{]*) continue ;;
              esac
              printf '%s\n' "$line"
            done | sort -u
          )
          if [ "${#image_refs[@]}" -eq 0 ]; then
            echo "Nothing to scan: no Docker image found." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Scanning ${#image_refs[@]} Docker image(s)." | tee -a "$GITHUB_STEP_SUMMARY"
          printf -- '- %s\n' "${image_refs[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          failed=0
          for image in "${image_refs[@]}"; do
            safe=$(printf '%s' "$image" | tr -c 'A-Za-z0-9._-' '_')
            report="trivy-reports/image-${safe}.txt"
            set +e
            trivy "${args[@]}" image \
              --scanners vuln \
              --severity "$TRIVY_SEVERITY" \
              --exit-code 1 \
              "$image" > "$report" 2>&1
            rc=$?
            set -e
            cat "$report" | tee -a trivy-reports/images.txt
            if [ "$rc" -eq 0 ]; then
              echo "No ${TRIVY_SEVERITY} findings in ${image}." | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$rc" -eq 1 ]; then
              echo "Findings in ${image}." | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            elif grep -Eiq 'manifest unknown|not found|does not exist|NAME_UNKNOWN|no such image' "$report"; then
              echo "Nothing to scan: ${image} is not available." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Scan failed for ${image}." | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

      - name: Scan others
        if: ${{ !cancelled() }}
        env:
          TRIVY_SEVERITY: ${{ inputs.severity }}
          TRIVY_CONFIG: ${{ inputs.config_path }}
        run: |
          mkdir -p trivy-reports
          args=()
          if [ -n "$TRIVY_CONFIG" ]; then
            args+=(--config "$TRIVY_CONFIG")
          fi
          set +e
          trivy "${args[@]}" config \
            --severity "$TRIVY_SEVERITY" \
            --exit-code 1 \
            --skip-dirs .git,.github,node_modules,vendor,target,dist,.terraform \
            . > trivy-reports/others.txt 2>&1
          rc=$?
          set -e
          cat trivy-reports/others.txt
          if grep -Eiq 'no config files|config files: 0|number of config files: 0' trivy-reports/others.txt; then
            echo "Nothing to scan: no other config files found." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then
            echo "No ${TRIVY_SEVERITY} findings in other config." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Findings in other config." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: trivy-reports
          path: trivy-reports/
          if-no-files-found: ignore
